    // -----------------------------------------------------------------------
    // 2. 실제 Web Crypto API (PBKDF2 + AES-256-GCM) 클라이언트 측 암호화 엔진
    // -----------------------------------------------------------------------
    const CryptoEngine = {
      salt: 'teamyak-phase2-salt-v1',
      async deriveKey(userId, passphrase = 'local-user-secret-key') {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(`${userId}::${passphrase}`),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );
        return window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: enc.encode(this.salt),
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      },
      bytesToBase64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
        return window.btoa(bin);
      },
      base64ToBytes(b64) {
        const bin = window.atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      },
      async encryptBlob(payloadObj, userId, passphrase = 'local-user-secret-key') {
        const plaintext = typeof payloadObj === 'string' ? payloadObj : JSON.stringify(payloadObj);
        if (!window.crypto || !window.crypto.subtle) {
          return { ciphertext: btoa(unescape(encodeURIComponent(plaintext))), iv: 'c2ltdWxhdGVkLWl2' };
        }
        const key = await this.deriveKey(userId, passphrase);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const buf = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
        return {
          ciphertext: this.bytesToBase64(new Uint8Array(buf)),
          iv: this.bytesToBase64(iv)
        };
      },
      async decryptBlob(ciphertext, iv, userId, passphrase = 'local-user-secret-key') {
        if (!window.crypto || !window.crypto.subtle) {
          return decodeURIComponent(escape(atob(ciphertext)));
        }
        try {
          const key = await this.deriveKey(userId, passphrase);
          const ivBytes = this.base64ToBytes(iv);
          const cipherBytes = this.base64ToBytes(ciphertext);
          const buf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBytes }, key, cipherBytes);
          return new TextDecoder().decode(buf);
        } catch (e) {
          return null;
        }
      }
    };

    // 초기 로드 시 실제 Web Crypto API로 샘플 개인 이력 암호문을 생성해 둠
    async function initRealCryptoForSamples() {
      for (const item of state.personalMeetingHistories) {
        if (item.decryptedMemoCache) {
          const payload = {
            counterpartOrg: getOrgById(item.counterpartOrganizationId)?.canonicalName,
            title: item.meetingTitleSnapshot,
            memo: item.decryptedMemoCache
          };
          const res = await CryptoEngine.encryptBlob(payload, item.ownerUserId);
          item.encryptedHistoryBlob = res.ciphertext;
          item.memoIv = res.iv;
        }
      }
      renderAll();
    }

    function getCurrentUser() {
      return state.users.find(u => u.id === state.currentUserId) || state.users[0];
    }

    function getOrgById(orgId) {
      return state.organizations.find(o => o.id === orgId);
    }

    function getTeamById(teamId) {
      return state.teams.find(t => t.id === teamId);
    }

    function getPlaceById(placeId) {
      return state.places.find(p => p.id === placeId);
    }

    function getUserActiveTeams(userId) {
      const user = state.users.find(u => u.id === userId);
      if (user && user.noTeamMode) return [];
      const memberships = state.teamMemberships.filter(tm => tm.userId === userId && tm.status === 'ACTIVE');
      return memberships.map(tm => ({
        membership: tm,
        team: getTeamById(tm.teamId),
        org: getOrgById(getTeamById(tm.teamId)?.organizationId)
      })).filter(x => x.team);
    }

    // 사용자가 직접 참석(또는 생성)한 모임인지 확인 (meetings 테이블 RLS 대응)
    function isUserDirectParticipant(userId, meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return false;
      if (mtg.createdBy === userId) return true;
      const p = state.meetingParticipants.find(mp => mp.meetingId === meetingId && mp.userId === userId);
      return p && (p.rsvpStatus === 'ATTENDING' || p.rsvpStatus === 'TENTATIVE');
    }

    // 사용자의 활성 팀에 공유(team_shared_schedules)된 일정인지 확인
    function getTeamSharedProjectionForUser(userId, meetingId) {
      const activeTeamIds = getUserActiveTeams(userId).map(t => t.team.id);
      return state.teamSharedSchedules.find(tss => tss.meetingId === meetingId && activeTeamIds.includes(tss.teamId)) || null;
    }

    // 팀 공유 토글 변경 시 team_shared_schedules 프로젝션 테이블을 실시간 동기화
    function syncTeamSharedSchedules(meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return;
      const sides = state.meetingSides.filter(ms => ms.meetingId === meetingId);
      const place = mtg.placeId ? getPlaceById(mtg.placeId) : null;

      for (const side of sides) {
        const vis = state.meetingVisibilities.find(mv => mv.meetingSideId === side.id);
        // 기존 프로젝션 제거
        const existingIdx = state.teamSharedSchedules.findIndex(tss => tss.meetingSideId === side.id);
        if (existingIdx !== -1) state.teamSharedSchedules.splice(existingIdx, 1);

        // 대표자가 TEAM_SHARED를 켜고 teamId가 존재하며 모임이 취소되지 않은 경우에만 정제된 프로젝션 생성
        if (vis && vis.shareScope === 'TEAM_SHARED' && side.teamId && mtg.status !== 'CANCELED') {
          const counterpartSide = sides.find(s => s.id !== side.id);
          const ourParticipants = state.meetingParticipants
            .filter(mp => mp.meetingSideId === side.id && mp.rsvpStatus === 'ATTENDING')
            .map(mp => state.users.find(u => u.id === mp.userId)?.displayName || '참석자');

          const counterpartParticipants = counterpartSide
            ? state.meetingParticipants
                .filter(mp => mp.meetingSideId === counterpartSide.id && mp.rsvpStatus === 'ATTENDING')
                .map(mp => state.users.find(u => u.id === mp.userId)?.displayName)
            : [];

          const counterpartSummary = vis.shareCounterpartNamesToTeam && counterpartParticipants.length > 0
            ? `${counterpartSide?.sideLabel || '상대 기관'} (${counterpartParticipants.join(', ')})`
            : `${counterpartSide?.sideLabel || '상대 기관'} (개인 식별정보·메모 비공개 보호됨)`;

          state.teamSharedSchedules.push({
            id: `tss_${side.id}`,
            teamId: side.teamId,
            meetingId: mtg.id,
            meetingSideId: side.id,
            sideType: side.sideType,
            meetingTitle: mtg.title,
            meetingStatus: mtg.status,
            confirmedDate: mtg.confirmedDate,
            startTime: mtg.startTime,
            endTime: mtg.endTime,
            placeSummary: place ? `${place.name} (${place.areaSummary})` : (mtg.placeTbdHint || '장소 미정'),
            ourSideParticipantsSummary: ourParticipants.join(', ') || side.sideLabel,
            counterpartOrgSummary: counterpartSummary,
            sharedByUserId: side.representativeUserId || mtg.createdBy,
            updatedAt: new Date().toISOString()
          });
        }
      }
    }

    function downloadMeetingIcs(meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return;
      const place = mtg.placeId ? getPlaceById(mtg.placeId) : null;
      const hostSide = state.meetingSides.find(ms => ms.meetingId === meetingId && ms.sideType === 'HOST');
      const userPref = state.notificationPreferences[state.currentUserId] || { morningBriefingTime: '08:00' };

      const dateClean = (mtg.confirmedDate || '2026-11-19').replace(/-/g, '');
      const startClean = (mtg.startTime || '12:00').replace(':', '') + '00';
      const endClean = (mtg.endTime || '13:30').replace(':', '') + '00';
      const alarmClean = (userPref.morningBriefingTime || '08:00').replace(':', '') + '00';
      const locText = place ? `${place.name} (${place.roadAddress})` : (mtg.placeTbdHint || '추후 확정');

      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//TEAMYAK//Mobile Business Meeting Platform//KO',
        'CALSCALE:GREGORIAN',
        `METHOD:${mtg.status === 'CANCELED' ? 'CANCEL' : 'PUBLISH'}`,
        'BEGIN:VEVENT',
        `UID:meeting-${mtg.id}@teamyak.kr`,
        `SEQUENCE:${mtg.sequenceVersion}`,
        `STATUS:${mtg.status === 'CANCELED' ? 'CANCELLED' : 'CONFIRMED'}`,
        `DTSTAMP:${dateClean}T000000Z`,
        `DTSTART;TZID=Asia/Seoul:${dateClean}T${startClean}`,
        `DTEND;TZID=Asia/Seoul:${dateClean}T${endClean}`,
        `SUMMARY:[팀약] ${mtg.title}`,
        `LOCATION:${locText}`,
        `DESCRIPTION:호스트: ${hostSide?.sideLabel || '팀약'}\\n상태: ${I18N.ko.meetingStatus[mtg.status].label}\\n버전: SEQUENCE v${mtg.sequenceVersion} (시간 변경 시 중복 생성 없이 기존 일정을 덮어씁니다)`,
        'BEGIN:VALARM',
        'ACTION:DISPLAY',
        `DESCRIPTION:[팀약 당일 아침 알림] 오늘 ${mtg.startTime || '12:00'} ${mtg.title} 약속이 있습니다. 장소: ${locText}`,
        `TRIGGER;VALUE=DATE-TIME:${dateClean}T${alarmClean}Z`,
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `teamyak-${mtg.id}-seq-v${mtg.sequenceVersion}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`📥 [RFC 5545 표준 .ics 다운로드 완료] UID(meeting-${mtg.id}@teamyak.kr) + SEQUENCE(v${mtg.sequenceVersion}) + 당일 ${userPref.morningBriefingTime} VALARM 알람이 포함되었습니다.`, 'success');
    }

            <button onclick="completeDeferredKakaoLogin(true)" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs flex items-center justify-center gap-1.5 border border-slate-300">
              <span>👤</span>
              <span>소속 팀 없이 개인 자격(무팀 모드)으로 로그인하고 [${rsvpLabel}] 완료</span>
            </button>
          </div>
        </div>
      `;
    }

    function completeDeferredKakaoLogin(useNoTeamMode) {
      state.isLoggedIn = true;
      const user = getCurrentUser();
      if (user) user.noTeamMode = Boolean(useNoTeamMode);
      closeModal();

      if (state.pendingRsvpIntent) {
        const { meetingId, rsvpChoice } = state.pendingRsvpIntent;
        state.pendingRsvpIntent = null;
        executeRsvpRegistration(meetingId, rsvpChoice);
      } else {
        renderAll();
      }
    }

    function executeRsvpRegistration(meetingId, rsvpChoice) {
      const user = getCurrentUser();
      const mtg = state.meetings.find(m => m.id === meetingId);
      const guestSide = state.meetingSides.find(ms => ms.meetingId === meetingId && ms.sideType === 'GUEST');
      const invite = state.meetingInvitations.find(inv => inv.meetingId === meetingId);
      if (!mtg || !guestSide) return;

      // 전달받은 초대 링크인지 검증 (원래 클레임된 대상 외 다른 사용자가 응답하는 경우)
      const isForwardedUser = (user.personaRole === 'FORWARDED_GUEST') ||
        (invite && invite.claimedByUserId && invite.claimedByUserId !== user.id && user.id !== mtg.createdBy);

      const finalStatus = (isForwardedUser && rsvpChoice === 'ATTENDING' && invite?.requireHostApprovalOnForward)
        ? 'PENDING_APPROVAL'
        : rsvpChoice;

      let participant = state.meetingParticipants.find(mp => mp.meetingId === meetingId && mp.userId === user.id);
      if (!participant) {
        participant = {
          id: `mp_${Date.now()}`,
          meetingId,
          meetingSideId: guestSide.id,
          userId: user.id,
          roleInSide: guestSide.representativeUserId === user.id ? 'REPRESENTATIVE' : 'PARTICIPANT',
          rsvpStatus: finalStatus,
          needsReconfirmAfterChange: false,
          attendanceCheck: 'UNCONFIRMED',
          isForwardedGuest: isForwardedUser,
          respondedAt: new Date().toISOString()
        };
        state.meetingParticipants.push(participant);
      } else {
        participant.rsvpStatus = finalStatus;
        participant.needsReconfirmAfterChange = false;
        participant.respondedAt = new Date().toISOString();
      }

      // 게스트 대표가 아직 지정되지 않았고 승인된 참석자라면 게스트 대표로 지정 가능
      if (!guestSide.representativeUserId && finalStatus === 'ATTENDING') {
        guestSide.representativeUserId = user.id;
        participant.roleInSide = 'REPRESENTATIVE';
      }

      syncTeamSharedSchedules(meetingId);

      if (finalStatus === 'PENDING_APPROVAL') {
        showToast('🚧 [전달된 초대 링크 감지] 원래 초대 대상 외 접속이므로 [호스트 승인 대기] 상태로 등록되었습니다. 호스트(또는 게스트 대표) 승인 전까지 상세 장소와 참석자 명단이 보호됩니다.', 'warning');
        state.currentTab = 'invite_landing';
      } else if (finalStatus === 'ATTENDING') {
        state.selectedMeetingId = meetingId;
        state.currentTab = 'meeting_detail';
        state.meetingDetailSubTab = 'INFO';
        showToast(`✅ [${mtg.title}] 참석이 확정되어 내 팀약 개인 캘린더에 자동 등록되었습니다! (내 소속 팀 공유 기본값: 비공개 OFF)`, 'success');
      } else if (finalStatus === 'DECLINED') {
        showToast(`↩️ [${mtg.title}] 불참(참석 철회) 처리되어 내 개인 캘린더에서 일정이 즉시 제거되었습니다.`, 'info');
      } else {
        showToast(`📌 [${mtg.title}] 응답이 [${I18N.ko.rsvp[finalStatus].label}]로 기록되었습니다.`, 'info');
      }
      renderAll();
    }

    // 전달된 링크 승인 대기(PENDING_APPROVAL) 참석자를 호스트 대표/게스트 대표가 승인
    function approveForwardedParticipant(participantId) {
      const mp = state.meetingParticipants.find(p => p.id === participantId);
      if (!mp) return;
      mp.rsvpStatus = 'ATTENDING';
      const targetUser = state.users.find(u => u.id === mp.userId);
      syncTeamSharedSchedules(mp.meetingId);
      showToast(`✅ [${targetUser?.displayName || '게스트'}]님의 추가 참석을 승인했습니다. 이제 해당 참석자의 캘린더에도 일정이 등록됩니다.`, 'success');
      renderAll();
    }

    // 호스트 대표 또는 게스트 대표의 독립적인 팀 공유 토글
    function toggleSideTeamSharing(meetingSideId) {
      const user = getCurrentUser();
      const side = state.meetingSides.find(ms => ms.id === meetingSideId);
      if (!side) return;

      if (side.representativeUserId !== user.id) {
        showToast('🚫 해당 측(호스트 또는 게스트)의 대표자만 본인 소속 팀 공유 여부를 변경할 수 있습니다.', 'danger');
        return;
      }
      if (!side.teamId || user.noTeamMode) {
        showToast('ℹ️ 현재 소속 팀 없이 개인 자격으로 참여 중이므로 팀 공유 대상이 없습니다.', 'warning');
        return;
      }

      let vis = state.meetingVisibilities.find(mv => mv.meetingSideId === meetingSideId);
      if (!vis) {
        vis = {
          id: `mv_${Date.now()}`,
          meetingSideId,
          teamId: side.teamId,
          shareScope: 'PRIVATE_PARTICIPANTS_ONLY',
          shareCounterpartNamesToTeam: false,
          decidedBy: user.id,
          updatedAt: new Date().toISOString()
        };
        state.meetingVisibilities.push(vis);
      }

      vis.shareScope = (vis.shareScope === 'TEAM_SHARED') ? 'PRIVATE_PARTICIPANTS_ONLY' : 'TEAM_SHARED';
      vis.decidedBy = user.id;
      vis.updatedAt = new Date().toISOString();

      syncTeamSharedSchedules(side.meetingId);

      const team = getTeamById(side.teamId);
      const org = getOrgById(team?.organizationId);
      const teamLabel = `${org?.canonicalName || ''} ${team?.name || ''}`;

      if (vis.shareScope === 'TEAM_SHARED') {
        showToast(`🔓 [${teamLabel}]에 일정 공유가 켜졌습니다. 분리된 team_shared_schedules 테이블에 정제된 요약만 생성되며, 상대방의 개인정보·비공개 메모는 노출되지 않습니다.`, 'success');
      } else {
        showToast(`🔒 [${teamLabel}] 일정 공유가 꺼졌습니다(비공개). 이제 소속 팀원들은 이 모임을 전혀 조회할 수 없습니다.`, 'info');
      }
      renderAll();
    }

    function openScheduleChangeModal(meetingId) {

    function applyScheduleChange(meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return;
      const newDate = document.getElementById('input-change-date')?.value || mtg.confirmedDate;
      const newStart = document.getElementById('input-change-start')?.value || mtg.startTime;
      const newEnd = document.getElementById('input-change-end')?.value || mtg.endTime;
      const newPlaceId = document.getElementById('input-change-place')?.value || mtg.placeId;

      mtg.confirmedDate = newDate;
      mtg.startTime = newStart;
      mtg.endTime = newEnd;
      mtg.isTimeTbd = false;
      mtg.placeId = newPlaceId;
      mtg.status = 'CONFIRMED';
      mtg.sequenceVersion += 1;
      mtg.updatedAt = new Date().toISOString();

      // 게스트 제안 초기화
      state.meetingSides.filter(ms => ms.meetingId === meetingId).forEach(ms => { ms.proposedTimeChange = null; });

      // 기존 참석자(호스트 본인 제외)에게 시간 변경 재확인 플래그 설정
      state.meetingParticipants
        .filter(mp => mp.meetingId === meetingId && mp.userId !== state.currentUserId && mp.rsvpStatus === 'ATTENDING')
        .forEach(mp => { mp.needsReconfirmAfterChange = true; });

      syncTeamSharedSchedules(meetingId);
      closeModal();
      showToast(`🔄 일정이 ${newDate} ${newStart}~${newEnd}으로 변경되었습니다 (SEQUENCE: v${mtg.sequenceVersion}). 기존 캘린더 일정이 중복 없이 업데이트되었으며 참석자에게 재확인 요청이 전송되었습니다.`, 'success');
      renderAll();
    }

    // 게스트 대표의 일정 변경 제안
    function proposeScheduleChangeByGuest(meetingId) {
      const guestSide = state.meetingSides.find(ms => ms.meetingId === meetingId && ms.sideType === 'GUEST');
      if (!guestSide) return;
      guestSide.proposedTimeChange = {
        proposedDate: '2026-11-19',
        proposedStartTime: '12:30',
        reason: '오전 마감 회의가 12시에 끝나 12시 30분으로 30분 순연 제안드립니다.',
        proposedByUserId: state.currentUserId
      };
      showToast('💬 호스트 대표(김민준 대리)에게 [11/19 12:30] 일정 변경 제안을 전달했습니다.', 'info');
      renderAll();
    }

    // 모임 취소 또는 복원 (상태 변화 검증)
    function toggleCancelMeeting(meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return;
      if (mtg.status === 'CANCELED') {
        mtg.status = 'CONFIRMED';
        mtg.sequenceVersion += 1;
        syncTeamSharedSchedules(meetingId);
        showToast(`✅ 모임이 다시 [일정 확정(v${mtg.sequenceVersion})] 상태로 복원되었습니다.`, 'success');
      } else {
        mtg.status = 'CANCELED';
        mtg.sequenceVersion += 1;
        syncTeamSharedSchedules(meetingId);
        showToast(`🚫 모임이 [취소됨(STATUS:CANCELED, v${mtg.sequenceVersion})] 처리되었습니다. 참석자들의 내부/외부 캘린더 슬롯이 비워지며 허위 미팅 이력이 생성되지 않습니다.`, 'danger');
      }
      renderAll();
    }

    // 모임 완료 및 개인 암호화 이력으로 이관
    async function completeMeetingAndCreateHistory(meetingId) {
      const mtg = state.meetings.find(m => m.id === meetingId);
      if (!mtg) return;
      mtg.status = 'COMPLETED';
      syncTeamSharedSchedules(meetingId);

      // 참석 확정자 각각에 대해 본인 소유의 개인 이력(personal_meeting_histories) 생성
      const sides = state.meetingSides.filter(ms => ms.meetingId === meetingId);
      const attendingList = state.meetingParticipants.filter(mp => mp.meetingId === meetingId && mp.rsvpStatus === 'ATTENDING');

      for (const mp of attendingList) {
        const mySide = sides.find(s => s.id === mp.meetingSideId);
        const counterpartSide = sides.find(s => s.id !== mp.meetingSideId);
        const counterpartOrgId = counterpartSide?.organizationId || 'org_samsung_life';
        const exists = state.personalMeetingHistories.some(h => h.ownerUserId === mp.userId && h.meetingId === mtg.id);
        if (!exists) {
          const defaultMemo = `${mtg.title} 완료 (장소: ${getPlaceById(mtg.placeId)?.name || mtg.placeTbdHint}). 개인 비공개 기록.`;
          const encRes = await CryptoEngine.encryptBlob({
            counterpartOrg: getOrgById(counterpartOrgId)?.canonicalName,
            title: mtg.title,
            memo: defaultMemo
          }, mp.userId);

          state.personalMeetingHistories.unshift({
            id: `pmh_${Date.now()}_${mp.userId}`,
            ownerUserId: mp.userId,
            meetingId: mtg.id,
            counterpartOrganizationId: counterpartOrgId,
            meetingDate: mtg.confirmedDate || '2026-11-19',
            meetingTitleSnapshot: mtg.title,
            attendanceVerified: false, // 사용자가 실제 참석 확인을 누르기 전 상태와 분리!
            encryptedHistoryBlob: encRes.ciphertext,
            memoIv: encRes.iv,
            decryptedMemoCache: defaultMemo
          });
        }
      }

      state.currentTab = 'history';
      showToast('🏁 모임이 [완료] 처리되어 각 참석자의 개인 이력 금고(personal_meeting_histories)에 AES-256-GCM 암호화 레코드가 생성되었습니다. 실제 참석 여부를 확인해 보세요!', 'success');
      renderAll();
    }

    // 이력에서 [실제 참석 확인] 토글 (참석 수락 vs 실제 만남 구분)
    function toggleVerifyAttendanceHistory(historyId) {
      const item = state.personalMeetingHistories.find(h => h.id === historyId && h.ownerUserId === state.currentUserId);
      if (!item) return;
      item.attendanceVerified = !item.attendanceVerified;
      showToast(item.attendanceVerified
        ? '✅ 단순 참석 수락(RSVP)에서 [실제 만남 확인됨(VERIFIED_ATTENDED)]으로 상태가 업데이트되었습니다.'
        : 'ℹ️ [참석 수락(미확인)] 상태로 변경되었습니다.', 'success');
      renderAll();
    }

    // 개인 메모 클라이언트 측 암호화 저장
    async function saveEncryptedPersonalMemo(historyId) {
      const input = document.getElementById(`memo-input-${historyId}`);
      if (!input) return;
      const item = state.personalMeetingHistories.find(h => h.id === historyId && h.ownerUserId === state.currentUserId);
      if (!item) return;

      const newMemo = input.value.trim();
      item.decryptedMemoCache = newMemo;
      const encRes = await CryptoEngine.encryptBlob({
        counterpartOrg: getOrgById(item.counterpartOrganizationId)?.canonicalName,
        title: item.meetingTitleSnapshot,
        memo: newMemo
      }, state.currentUserId);

      item.encryptedHistoryBlob = encRes.ciphertext;
      item.memoIv = encRes.iv;
      showToast('🔐 브라우저 내 Web Crypto API(PBKDF2 + AES-256-GCM)로 암호화되어 저장되었습니다. DB 관리자와 서버 운영자도 평문을 볼 수 없습니다.', 'success');
      renderAll();
    }

    function deletePersonalHistory(historyId) {
      const idx = state.personalMeetingHistories.findIndex(h => h.id === historyId && h.ownerUserId === state.currentUserId);
      if (idx !== -1) {
        state.personalMeetingHistories.splice(idx, 1);
        showToast('🗑️ 선택한 개인 미팅 이력이 영구 삭제되었습니다.', 'info');
        renderAll();
      }
    }

    function exportPersonalHistoriesJson() {
      const myHistories = state.personalMeetingHistories.filter(h => h.ownerUserId === state.currentUserId);
      const dataStr = JSON.stringify(myHistories, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `teamyak-personal-history-${state.currentUserId}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📦 내 개인 미팅 이력(JSON) 내보내기가 완료되었습니다.', 'success');
    }

    function submitCreateMeeting() {
      const title = document.getElementById('new-mtg-title')?.value?.trim() || '삼성생명 홍보팀 오찬';
      const dateVal = document.getElementById('new-mtg-date')?.value || '2026-11-19';
      const isTbd = document.getElementById('new-mtg-time-tbd')?.checked || false;
      const startVal = isTbd ? null : (document.getElementById('new-mtg-start')?.value || '12:00');
      const endVal = isTbd ? null : (document.getElementById('new-mtg-end')?.value || '13:30');
      const placeId = document.getElementById('new-mtg-place')?.value || null;
      const hostShare = document.getElementById('new-mtg-host-share')?.checked;

      // 기본 샘플 모임(mtg_1) 업데이트 후 카카오톡 초대장 화면으로 이동
      const mtg = state.meetings.find(m => m.id === 'mtg_1');
      if (mtg) {
        mtg.title = title;
        mtg.confirmedDate = dateVal;
        mtg.isTimeTbd = isTbd;
        mtg.startTime = startVal;
        mtg.endTime = endVal;

                      <span class="px-1.5 py-0.5 rounded bg-white border border-brand-200 text-[10px] font-mono text-slate-600">SEQUENCE: v${m.sequenceVersion}</span>
                    </div>
                    <div class="font-bold text-sm text-slate-900">${m.title}</div>
                    <div class="text-xs text-slate-600">📍 ${p ? p.name : m.placeTbdHint}</div>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                      <button onclick="state.selectedMeetingId='${m.id}'; state.currentTab='meeting_detail'; renderAll();" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-800 font-semibold text-[11px]">
                        상세 보기
                      </button>
                      <button onclick="openGoogleCalendarTemplate('${m.id}')" class="px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold text-[11px]">
                        Google 캘린더 등록 ↗
                      </button>
                      <button onclick="downloadMeetingIcs('${m.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white font-semibold text-[11px]">
                        📥 ICS 파일(.ics) 저장
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}

              <!-- 시간 미정(TBD) 가일정 분리 표시 -->
              ${myTbdMeetings.length > 0 ? `
                <div class="pt-2 border-t border-slate-200 space-y-2">
                  <div class="text-[11px] font-bold text-amber-800">⏳ 시간 미정 · 조율 중 모임 (확정 일정과 분리됨)</div>
                  ${myTbdMeetings.map(m => `
                    <div onclick="state.selectedMeetingId='${m.id}'; state.currentTab='meeting_detail'; renderAll();" class="p-3 rounded-xl bg-amber-50/70 border border-amber-200 cursor-pointer text-xs space-y-1">
                      <div class="font-bold text-slate-900">${m.title}</div>
                      <div class="text-[11px] text-amber-900">후보일: ${m.candidateDates.join(', ')} · 시간 미정 (참석 의향 등록됨)</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- 2. 물리적으로 분리된 팀 공유 일정 (team_shared_schedules) 섹션 -->
          ${state.calendarFilter !== 'PERSONAL' ? `
            <div class="bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="font-extrabold text-xs text-slate-900">👥 우리 팀 공유 일정 (team_shared_schedules 분리 뷰)</h3>
                  <p class="text-[10px] text-slate-500">대표자가 팀 공유(ON)를 허용한 일정만 정제되어 표시되며 상대방 개인정보·메모는 제외됩니다.</p>
                </div>
              </div>

              ${teamSharedRows.length === 0 ? `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1.5">
                  <div class="font-bold text-slate-900">🔒 현재 소속 팀에 공유 허용된 일정이 없습니다 (0건)</div>
                  <p class="text-[11px] text-slate-500 leading-relaxed">
                    예: 중앙일보 박서연 기자가 [삼성생명 홍보팀 오찬]에 참석했더라도 <strong>게스트 팀 공유를 켜지 않았기 때문에(기본값 OFF)</strong>, 같은 중앙일보 금융팀 동료인 최지훈 기자에게는 해당 모임이 절대 노출되지 않습니다.
                  </p>
                </div>
              ` : teamSharedRows.map(row => `
                <div class="p-3.5 rounded-xl bg-emerald-50/50 border border-emerald-200 space-y-1.5 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="px-2 py-0.5 rounded bg-emerald-700 text-white text-[10px] font-bold">팀 공유 승인됨 (${row.sideType} 측)</span>
                    <span class="font-bold text-slate-700">${row.confirmedDate} · ${row.startTime || '시간미정'}</span>
                  </div>
                  <div class="font-extrabold text-sm text-slate-900">${row.meetingTitle}</div>
                  <div class="text-slate-600">📍 장소 요약: ${row.placeSummary}</div>
                  <div class="text-slate-600">👤 우리 팀 참석: ${row.ourSideParticipantsSummary}</div>
                  <div class="text-[11px] text-emerald-900 bg-white/80 px-2.5 py-1.5 rounded-lg border border-emerald-200">
                    🛡️ 상대방 표시(정제됨): <strong>${row.counterpartOrgSummary}</strong>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <!-- 3. Google Calendar 자동 동기화 vs ICS 파일 추가 기술적 차이 명시 -->
          <div class="bg-slate-900 text-slate-100 rounded-2xl p-4 space-y-2.5 text-xs">
            <div class="font-bold text-amber-300">⚙️ 개인 캘린더 vs 외부 캘린더 동기화 방식 구분</div>
            <div class="space-y-2 text-[11px] text-slate-300 leading-relaxed">
              <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700">
                <div class="font-bold text-white">① Google Calendar 자동 동기화 (OAuth 쓰기 동의 방식)</div>
                <div>• 상태: <strong class="${calConn.googleWriteConsent ? 'text-emerald-400' : 'text-amber-400'}">${calConn.googleWriteConsent ? `연결됨 (${calConn.googleEmail})` : '미연결'}</strong> (※ 프로토타입 시뮬레이션 + 웹 템플릿 연결)</div>
                <div>• 특징: 최초 1회 쓰기 동의 후 참석 수락 시 자동 등록되며, 호스트가 시간을 변경하면 저장된 <code>google_event_id</code>로 <code>events.patch</code>를 수행해 중복 없이 자동 수정됩니다.</div>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700">
                <div class="font-bold text-white">② ICS 파일 다운로드 (.ics 표준 규격 — 실제 파일 생성 동작)</div>
                <div>• 특징: Apple 캘린더·아웃룩·삼성 캘린더용 표준 파일을 생성합니다. 동일 <code>UID</code>와 증가된 <code>SEQUENCE</code>, 당일 오전 08:00 <code>VALARM</code>이 포함됩니다.</div>
                <div>• 차이점: 정적 파일 방식이므로 호스트가 시간을 변경하면 알림 배너에서 업데이트된 <code>.ics</code> 파일을 다시 내려받아 열어야 기존 일정이 덮어써집니다.</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // [화면 4] 모임 목록 화면 (내가 만든 모임 / 초대받은 모임)
    // -----------------------------------------------------------------------
    function renderMeetingsListScreen() {
      const user = getCurrentUser();
      const visibleMeetings = state.meetings.filter(m => isUserDirectParticipant(user.id, m.id));

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold text-slate-900">내 모임 관리</h2>
            <button onclick="state.currentTab='create_meeting'; renderAll();" class="px-3 py-1.5 rounded-xl bg-brand-600 text-white font-bold text-xs shadow-sm">
              + 새 모임 만들기
            </button>
          </div>

          ${visibleMeetings.length === 0 ? `
            <div class="bg-white rounded-2xl p-6 text-center border border-slate-200 space-y-2">
              <div class="text-sm font-bold text-slate-800">참여 중인 모임이 없습니다</div>
              <p class="text-xs text-slate-500">비참석 팀원은 원본 모임(meetings)을 직접 조회할 수 없으며, [캘린더 > 팀 공유 일정]에서만 공유 승인된 일정을 볼 수 있습니다.</p>
            </div>
          ` : visibleMeetings.map(m => {
            const st = I18N.ko.meetingStatus[m.status];
            const hostSide = state.meetingSides.find(ms => ms.meetingId === m.id && ms.sideType === 'HOST');
            const guestSide = state.meetingSides.find(ms => ms.meetingId === m.id && ms.sideType === 'GUEST');
            const p = m.placeId ? getPlaceById(m.placeId) : null;
            return `
              <div onclick="state.selectedMeetingId='${m.id}'; state.currentTab='meeting_detail'; renderAll();" class="bg-white rounded-2xl p-4 border border-slate-200 hover:border-brand-500 shadow-sm cursor-pointer transition space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="px-2 py-0.5 rounded border text-[10px] font-bold ${st.badgeClass}">${st.label}</span>
                  <span class="text-[11px] font-mono text-slate-400">SEQUENCE v${m.sequenceVersion}</span>
                </div>
                <div class="font-extrabold text-base text-slate-900">${m.title}</div>
                <div class="text-xs text-slate-600 space-y-1">
                  <div>🗓️ ${m.confirmedDate || '후보일 조율'} · ${m.isTimeTbd ? '시간 미정' : `${m.startTime}~${m.endTime}`}</div>
                  <div>📍 ${p ? p.name : (m.placeTbdHint || '미정')}</div>
                  <div>🤝 호스트: <strong>${hostSide?.sideLabel}</strong> ↔ 게스트: <strong>${guestSide?.sideLabel}</strong></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // [화면 5] 모임 상세 화면 ([모임 정보] [참석자·권한] [장소·길찾기] [관련 뉴스])
    // -----------------------------------------------------------------------
    function renderMeetingDetailScreen() {
      const user = getCurrentUser();
      const mtg = state.meetings.find(m => m.id === state.selectedMeetingId) || state.meetings[0];
      const hostSide = state.meetingSides.find(ms => ms.meetingId === mtg.id && ms.sideType === 'HOST');
      const guestSide = state.meetingSides.find(ms => ms.meetingId === mtg.id && ms.sideType === 'GUEST');
      const hostVis = state.meetingVisibilities.find(mv => mv.meetingSideId === hostSide?.id);
      const guestVis = state.meetingVisibilities.find(mv => mv.meetingSideId === guestSide?.id);
      const place = mtg.placeId ? getPlaceById(mtg.placeId) : null;
      const participants = state.meetingParticipants.filter(mp => mp.meetingId === mtg.id);
      const myMp = participants.find(mp => mp.userId === user.id);

      const isHostRep = hostSide?.representativeUserId === user.id;
      const isGuestRep = guestSide?.representativeUserId === user.id;
      const st = I18N.ko.meetingStatus[mtg.status];

      // 비참석 팀원이 상세 화면에 직접 접근하려 할 경우 RLS 차단 화면 표시!
      if (!isUserDirectParticipant(user.id, mtg.id) && user.personaRole !== 'SYSTEM_ADMIN') {
        const sharedRow = getTeamSharedProjectionForUser(user.id, mtg.id);
        return `
          <div class="bg-white rounded-2xl p-5 border-2 border-rose-200 space-y-3 text-xs">
            <div class="font-extrabold text-sm text-rose-700">🔒 모임 원본 상세 접근 제한 (RLS 보호 작동 중)</div>
            <p class="text-slate-600 leading-relaxed">
              현재 접속 중인 <strong>${user.displayName}</strong>님은 이 모임의 직접 참석자가 아닙니다. 비참석 팀원은 상대방 개인정보와 비공개 맥락이 포함된 모임 원본을 열람할 수 없습니다.
            </p>
            ${sharedRow ? `
              <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 space-y-1">
                <div class="font-bold text-emerald-900">✅ 단, 우리 팀 대표자가 공유한 정제 요약(team_shared_schedules)은 확인 가능합니다:</div>
                <div>• 일시: ${sharedRow.confirmedDate} ${sharedRow.startTime}</div>
                <div>• 장소 요약: ${sharedRow.placeSummary}</div>
                <div>• 상대 기관 요약: ${sharedRow.counterpartOrgSummary}</div>
              </div>
            ` : `
              <div class="p-3 rounded-xl bg-slate-100 text-slate-700 font-semibold">
                소속 팀 대표자가 이 모임을 팀에 공유하지 않았으므로(기본값 비공개) 팀 캘린더에서도 노출되지 않습니다.
              </div>
            `}
            <button onclick="state.currentTab='calendar'; renderAll();" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold">캘린더로 돌아가기</button>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <!-- 상단 요약 카드 -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full border text-[11px] font-bold ${st.badgeClass}">${st.label}</span>
              <span class="text-[11px] font-mono text-slate-500">UID: meeting-${mtg.id} (v${mtg.sequenceVersion})</span>
            </div>

            <div>
              <h2 class="text-lg font-extrabold text-slate-900">${mtg.title}</h2>
              <p class="text-xs text-slate-600 mt-0.5">${mtg.description || ''}</p>
            </div>

            <!-- 양측 독립적인 팀 공유 컨트롤 박스 (핵심 요구사항 2, 3, 4) -->
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-2 text-xs">
              <div class="font-bold text-slate-800 flex items-center justify-between">
                <span>🛡️ 양측 대표의 독립적인 소속 팀 공유 설정</span>
                <span class="text-[10px] text-slate-500 font-normal">기본값: 비공개</span>
              </div>

              <!-- 호스트 측 공유 토글 -->
              <div class="flex items-center justify-between p-2 rounded-lg bg-white border border-slate-200">
                <div>
                  <div class="font-bold text-slate-800">호스트 팀 (${hostSide?.sideLabel})</div>
                  <div class="text-[10px] text-slate-500">결정권자: 김민준 대리 (호스트 대표)</div>
                </div>
                <button onclick="toggleSideTeamSharing('${hostSide?.id}')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] transition ${
                  hostVis?.shareScope === 'TEAM_SHARED'
                    ? 'bg-blue-600 text-white'
                    : 'bg-slate-200 text-slate-700'
                }">
                  ${hostVis?.shareScope === 'TEAM_SHARED' ? '팀 공유 ON' : '비공개 OFF'}
                </button>
              </div>

              <!-- 게스트 측 공유 토글 -->
              <div class="flex items-center justify-between p-2 rounded-lg bg-white border border-slate-200">
                <div>
                  <div class="font-bold text-slate-800">게스트 팀 (${guestSide?.sideLabel})</div>
                  <div class="text-[10px] text-slate-500">결정권자: 박서연 기자 (게스트 대표)</div>
                </div>
                <button onclick="toggleSideTeamSharing('${guestSide?.id}')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] transition ${
                  guestVis?.shareScope === 'TEAM_SHARED'
                    ? 'bg-emerald-600 text-white'
                    : 'bg-slate-200 text-slate-700'
                }">
                  ${guestVis?.shareScope === 'TEAM_SHARED' ? '팀 공유 ON' : '비공개 OFF'}
                </button>
              </div>
            </div>
          </div>

          <!-- 모임 상세 4대 서브 탭 ([모임 정보] [참석자] [장소] [관련 뉴스]) -->
          <div class="grid grid-cols-4 gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-bold">
            <button onclick="state.meetingDetailSubTab='INFO'; renderAll();" class="py-2 rounded-lg ${state.meetingDetailSubTab === 'INFO' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">모임 정보</button>
            <button onclick="state.meetingDetailSubTab='PARTICIPANTS'; renderAll();" class="py-2 rounded-lg ${state.meetingDetailSubTab === 'PARTICIPANTS' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">참석자(${participants.length})</button>
            <button onclick="state.meetingDetailSubTab='PLACE'; renderAll();" class="py-2 rounded-lg ${state.meetingDetailSubTab === 'PLACE' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">장소</button>
            <button onclick="state.meetingDetailSubTab='NEWS'; renderAll();" class="py-2 rounded-lg ${state.meetingDetailSubTab === 'NEWS' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-600'}">관련 뉴스</button>
          </div>

          <!-- 서브탭 콘텐츠 렌더링 -->
          ${renderMeetingDetailSubTabContent(mtg, hostSide, guestSide, place, participants, myMp, isHostRep, isGuestRep)}
        </div>
      `;
    }

    function renderMeetingDetailSubTabContent(mtg, hostSide, guestSide, place, participants, myMp, isHostRep, isGuestRep) {
      if (state.meetingDetailSubTab === 'INFO') {
        return `
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3.5 text-xs">
            <div class="space-y-2">
              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">확정 일시</span>
                <span class="font-bold text-slate-900">${mtg.confirmedDate} · ${mtg.isTimeTbd ? '시간 미정(조율 중)' : `${mtg.startTime} ~ ${mtg.endTime}`}</span>
              </div>
              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">모임 장소</span>
                <span class="font-bold text-slate-900">${place ? place.name : (mtg.placeTbdHint || '미정')}</span>
              </div>
              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">내 참석 상태</span>
                <span class="font-extrabold text-emerald-700">${myMp ? I18N.ko.rsvp[myMp.rsvpStatus].label : '미응답'}</span>
              </div>
            </div>

            <!-- 게스트 측 일정 변경 제안이 있을 경우 표시 -->
            ${guestSide?.proposedTimeChange ? `
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 space-y-1.5">
                <div class="font-bold text-amber-900">💬 게스트 대표(박서연 기자)의 일정 변경 제안</div>
                <div class="text-[11px] text-amber-800">"${guestSide.proposedTimeChange.reason}"</div>
                ${isHostRep ? `
                  <button onclick="openScheduleChangeModal('${mtg.id}')" class="px-3 py-1.5 rounded-lg bg-amber-600 text-white font-bold text-[11px]">
                    제안 반영하여 시간 변경하기
                  </button>
                ` : ''}
              </div>
            ` : ''}

            <!-- 역할별 액션 버튼 (일정 변경 / 취소 / 참석 철회 / 모임 완료) -->
            <div class="pt-2 space-y-2">
              <div class="font-bold text-slate-700">⚡ 역할별 권한 및 상태 변경 액션</div>

              ${isHostRep ? `
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="openScheduleChangeModal('${mtg.id}')" class="py-2.5 px-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold">
                    🕒 일시·장소 변경 (호스트)
                  </button>
                  <button onclick="toggleCancelMeeting('${mtg.id}')" class="py-2.5 px-3 rounded-xl ${mtg.status === 'CANCELED' ? 'bg-emerald-600 text-white' : 'bg-rose-50 text-rose-700 border border-rose-200'} font-bold">
                    ${mtg.status === 'CANCELED' ? '♻️ 모임 취소 복원' : '🚫 모임 취소 (호스트)'}
                  </button>
                </div>
                <button onclick="completeMeetingAndCreateHistory('${mtg.id}')" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold">
                  🏁 모임 완료 처리 및 개인 암호화 이력 생성
                </button>
              ` : ''}

              ${isGuestRep ? `
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="proposeScheduleChangeByGuest('${mtg.id}')" class="py-2.5 px-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold">
                    💬 호스트에게 시간 변경 제안
                  </button>
                  <button onclick="handleInviteRsvpClick('${mtg.id}', 'DECLINED')" class="py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold">
                    ↩️ 참석 철회 (불참 전환)
                  </button>
                </div>
              ` : ''}

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="downloadMeetingIcs('${mtg.id}')" class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold border border-slate-300">
                  📥 .ics 캘린더 파일 저장
                </button>
                <button onclick="state.currentTab='invite_landing'; renderAll();" class="py-2 rounded-xl bg-kakao-yellow text-kakao-brown font-bold">
                  💬 카톡 초대장 다시 보기
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.meetingDetailSubTab === 'PARTICIPANTS') {
        return `
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3 text-xs">
            <div class="font-extrabold text-slate-900">참석자 명단 및 전달 링크 승인 관리</div>
            <div class="space-y-2">
              ${participants.map(mp => {
                const u = state.users.find(x => x.id === mp.userId);
                const side = state.meetingSides.find(s => s.id === mp.meetingSideId);
                const rsvpInfo = I18N.ko.rsvp[mp.rsvpStatus];
                return `
                  <div class="p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-1.5">
                        <span class="font-bold text-slate-900">${u?.displayName || '참석자'}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${side?.sideType === 'HOST' ? '호스트 측' : '게스트 측'} · ${mp.roleInSide === 'REPRESENTATIVE' ? '대표' : '일반'}</span>
                      </div>
                      <div class="text-[11px] text-slate-500 mt-0.5">${u?.jobTitle || ''} ${mp.isForwardedGuest ? '· (전달된 링크 접속)' : ''}</div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <span class="px-2 py-1 rounded-lg text-[10px] font-bold ${rsvpInfo.color}">${rsvpInfo.label}</span>
                      ${mp.rsvpStatus === 'PENDING_APPROVAL' && (isHostRep || isGuestRep) ? `
                        <button onclick="approveForwardedParticipant('${mp.id}')" class="px-2.5 py-1 rounded-lg bg-brand-600 text-white font-bold text-[10px]">
                          승인하기
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (state.meetingDetailSubTab === 'PLACE') {
        return `
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3.5 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-extrabold text-sm text-slate-900">📍 ${place ? place.name : (mtg.placeTbdHint || '장소 미확정')}</span>
              <span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">네이버 지도 연결</span>
            </div>

            ${place ? `
              <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-1.5">
                <div class="font-semibold text-slate-800">도로명 주소: ${place.roadAddress}</div>
                <div class="text-slate-500">지번 주소: ${place.jibunAddress}</div>
                <div class="text-brand-700 font-medium pt-1">ℹ️ ${place.officialInfoSummary}</div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <a href="${place.naverMapUrl}" target="_blank" rel="noopener noreferrer" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-center">
                  🗺️ 네이버 지도 길찾기 ↗
                </a>
                <a href="${place.externalBookingUrl}" target="_blank" rel="noopener noreferrer" class="py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-center">
                  🍽️ 외부 예약 페이지 열기 ↗
                </a>
              </div>
              <p class="text-[10px] text-slate-500">
                ※ 네이버 지역 검색 API는 실시간 식당 예약 확정 API를 제공하지 않으므로, 허위 '예약 완료'를 표시하지 않고 공식 외부 예약 페이지로 투명하게 연결합니다.
              </p>
            ` : `
              <div class="py-4 text-center text-slate-500">아직 구체적인 장소가 확정되지 않았습니다 (${mtg.placeTbdHint || '지역 조율 중'}).</div>
            `}

            ${isHostRep ? `
              <button onclick="openScheduleChangeModal('${mtg.id}')" class="w-full py-2.5 rounded-xl bg-brand-50 text-brand-700 border border-brand-200 font-bold">
                호스트 권한으로 다른 장소 검색·변경하기
              </button>
            ` : ''}
          </div>
        `;
      }

      // [관련 뉴스] 서브탭: ① 우리 회사 뉴스 / ② 만나는 회사 뉴스
      const user = getCurrentUser();
      const mySide = state.meetingSides.find(s => s.meetingId === mtg.id && ((s.sideType === 'HOST' && user.personaRole.includes('PR')) || (s.sideType === 'GUEST' && user.personaRole.includes('PRESS')))) || hostSide;
      const counterpartSide = (mySide?.id === hostSide?.id) ? guestSide : hostSide;

      const ourOrg = getOrgById(mySide?.organizationId || 'org_samsung_life');
      const counterpartOrg = getOrgById(counterpartSide?.organizationId || 'org_samsung_life');
      const targetOrg = state.meetingNewsSubTab === 'OUR' ? ourOrg : counterpartOrg;
      const articles = state.newsArticles.filter(a => a.organizationId === targetOrg?.id);

      return `
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3 text-xs">
          <!-- 2개 탭: ① 우리 회사 뉴스 / ② 만나는 회사 뉴스 -->
          <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl font-bold">
            <button onclick="state.meetingNewsSubTab='OUR'; renderAll();" class="py-2 rounded-lg ${state.meetingNewsSubTab === 'OUR' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">
              ① 우리 회사 (${ourOrg?.canonicalName})
            </button>
            <button onclick="state.meetingNewsSubTab='COUNTERPART'; renderAll();" class="py-2 rounded-lg ${state.meetingNewsSubTab === 'COUNTERPART' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'}">
              ② 만나는 회사 (${counterpartOrg?.canonicalName})
            </button>
          </div>

          <div class="flex items-center justify-between text-[11px] px-1">
            <span class="font-bold text-slate-700">${targetOrg?.canonicalName} 관련 최신 기사 (${articles.length}건)</span>
            <button onclick="state.selectedOrgIdForNews='${targetOrg?.id}'; state.currentTab='news'; renderAll();" class="text-brand-600 font-semibold">키워드 편집 →</button>
          </div>

          <div class="space-y-2">
            ${articles.map(art => `
              <a href="${art.originalUrl}" target="_blank" rel="noopener noreferrer" class="block p-3 rounded-xl border border-slate-200 hover:border-brand-500 transition space-y-1">
                <div class="flex items-center justify-between text-[10px] text-slate-500">
                  <span class="font-bold text-brand-700">#${art.matchedKeyword} · ${art.pressName}</span>
                  <span>${art.publishedAt}</span>
                </div>
                <div class="font-bold text-slate-900 text-xs leading-snug">${art.title} ↗</div>
                <p class="text-[11px] text-slate-600 leading-relaxed">${art.summarySnippet}</p>
              </a>
            `).join('')}
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // [화면 6] 이력 화면 (내 미팅 이력 vs 기관별 미팅 이력 + 별칭 검색 + Web Crypto 암호화)
    // -----------------------------------------------------------------------
    function renderHistoryScreen() {
      const user = getCurrentUser();
      // 오직 본인(ownerUserId === user.id)의 개인 이력만 조회 가능!
      const myHistories = state.personalMeetingHistories.filter(h => h.ownerUserId === user.id);

      // 검색어 필터링 (기관 별칭 한국은행·한은·BOK 통합 매칭 지원!)
      const q = state.historySearchQuery.trim().toLowerCase();
      const filteredHistories = myHistories.filter(h => {
        if (!q) return true;
        const org = getOrgById(h.counterpartOrganizationId);
        const aliasMatch = org?.aliases?.some(al => al.toLowerCase().includes(q)) || org?.canonicalName.toLowerCase().includes(q);
        const titleMatch = (h.meetingTitleSnapshot || '').toLowerCase().includes(q);
        const dateMatch = (h.meetingDate || '').includes(q);
        return aliasMatch || titleMatch || dateMatch;
      });

      // 기관별 그룹핑
      const orgGroups = {};
      for (const h of filteredHistories) {
        const oid = h.counterpartOrganizationId;
        if (!orgGroups[oid]) orgGroups[oid] = [];
        orgGroups[oid].push(h);
      }

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">내 미팅 이력 (개인 독점 금고)</h2>
              <p class="text-[10px] text-slate-500">본인 소유로 취급하며 소속 팀이나 운영자에게 자동 공유되지 않습니다</p>
            </div>
            <button onclick="exportPersonalHistoriesJson()" class="px-2.5 py-1.5 rounded-xl bg-slate-900 text-white font-bold text-[11px]">
              📦 이력 내보내기
            </button>
          </div>

          <!-- 서브탭: 개인 미팅 이력 / 기관별 미팅 이력 -->
          <div class="grid grid-cols-2 gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-bold">
            <button onclick="state.historyTab='PERSONAL'; renderAll();" class="py-2 rounded-lg ${state.historyTab === 'PERSONAL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
              날짜별 개인 이력 (${filteredHistories.length})
            </button>
            <button onclick="state.historyTab='ORG'; renderAll();" class="py-2 rounded-lg ${state.historyTab === 'ORG' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-600'}">
              기관별 접촉 이력 (${Object.keys(orgGroups).length}개 기관)
            </button>
          </div>

          <!-- 기관 별칭(한국은행·한은·BOK) 통합 검색창 -->
          <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm space-y-2">
            <div class="flex items-center gap-2">
              <input
                type="text"
                value="${state.historySearchQuery}"
                oninput="state.historySearchQuery=this.value; renderAll();"
                placeholder="날짜 또는 기관명·별칭 검색 (예: 한은, BOK, 삼성생명)"
                class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs"
              />
              ${state.historySearchQuery ? `
                <button onclick="state.historySearchQuery=''; renderAll();" class="px-2 py-1 text-xs text-slate-500">초기화</button>
              ` : ''}
            </div>
            <div class="flex flex-wrap gap-1 text-[10px]">
              <span class="text-slate-400">별칭 통합 검색 예시:</span>
              <button onclick="state.historySearchQuery='BOK'; renderAll();" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium">"BOK" → 한국은행 매칭</button>
              <button onclick="state.historySearchQuery='한은'; renderAll();" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium">"한은" → 한국은행 매칭</button>
              <button onclick="state.historySearchQuery='삼성생명'; renderAll();" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium">"삼성생명"</button>
            </div>
          </div>

          ${filteredHistories.length === 0 ? `
            <div class="bg-white rounded-2xl p-6 text-center border border-slate-200 text-xs text-slate-500">
              현재 계정(${user.displayName})의 개인 미팅 이력이 없습니다.<br/>
              <span class="text-[11px] text-slate-400">(다른 사람의 개인 이력은 철저히 격리되어 조회되지 않습니다)</span>
            </div>
          ` : state.historyTab === 'PERSONAL' ? `
            <div class="space-y-3">
              ${filteredHistories.map(h => {
                const org = getOrgById(h.counterpartOrganizationId);
                return `
                  <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5 text-xs">
                    <div class="flex items-center justify-between">
                      <span class="font-extrabold text-brand-700">${h.meetingDate} — ${org?.canonicalName || '기관'}</span>
                      <button onclick="toggleVerifyAttendanceHistory('${h.id}')" class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                        h.attendanceVerified
                          ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                          : 'bg-amber-50 text-amber-800 border-amber-300'
                      }">
                        ${h.attendanceVerified ? '✓ 실제 참석 확인됨' : '⏳ 참석 수락(클릭하여 실제 만남 확인)'}
                      </button>
                    </div>

                    <div class="font-bold text-sm text-slate-900">${h.meetingTitleSnapshot}</div>

                    <!-- 클라이언트 측 암호화(AES-256-GCM) 개인 메모 편집기 -->
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-2">
                      <div class="flex items-center justify-between text-[10px]">
                        <span class="font-bold text-slate-700">🔐 나만의 암호화 메모 (Web Crypto AES-256-GCM)</span>
                        <span class="text-emerald-700 font-mono">IV: ${h.memoIv}</span>
                      </div>
                      <textarea id="memo-input-${h.id}" rows="2" class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-white">${h.decryptedMemoCache || ''}</textarea>
                      <div class="text-[10px] text-slate-500 font-mono truncate bg-slate-200/70 px-2 py-1 rounded">
                        DB 저장 암호문: ${h.encryptedHistoryBlob}
                      </div>
                      <div class="flex justify-between items-center pt-1">
                        <button onclick="deletePersonalHistory('${h.id}')" class="text-[11px] text-rose-600 font-semibold hover:underline">이력 삭제</button>
                        <button onclick="saveEncryptedPersonalMemo('${h.id}')" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white font-bold text-[11px]">암호화 저장</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <!-- 기관별 미팅 이력 뷰 -->
            <div class="space-y-3">
              ${Object.entries(orgGroups).map(([orgId, list]) => {
                const org = getOrgById(orgId);
                return `
                  <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5 text-xs">
                    <div class="flex items-center justify-between">
                      <div>
                        <h3 class="font-extrabold text-sm text-slate-900">${org?.canonicalName}</h3>
                        <p class="text-[10px] text-slate-500">통합 별칭: ${(org?.aliases || []).join(' · ')}</p>
                      </div>
                      <button onclick="state.selectedOrgIdForNews='${orgId}'; state.currentTab='news'; renderAll();" class="px-2.5 py-1 rounded-lg bg-brand-50 text-brand-700 font-bold text-[11px]">
                        📰 관련 뉴스 보기
                      </button>
                    </div>
                    <div class="text-[11px] font-semibold text-slate-700">최근 만남: ${list[0]?.meetingDate} (총 ${list.length}회 기록)</div>
                    <div class="space-y-1.5 pt-1 border-t border-slate-100">
                      ${list.map(item => `
                        <div class="flex items-center justify-between py-1 text-xs">
                          <span class="font-medium text-slate-800">• ${item.meetingDate} — ${item.meetingTitleSnapshot}</span>
                          <span class="text-[10px] ${item.attendanceVerified ? 'text-emerald-700 font-bold' : 'text-amber-700'}">${item.attendanceVerified ? '실제 참석' : '수락 기록'}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // [화면 7] 기관별 뉴스 및 키워드 관리 화면
    // -----------------------------------------------------------------------
    function renderNewsScreen() {
      const org = getOrgById(state.selectedOrgIdForNews) || state.organizations[0];
      const keywords = state.newsKeywords.filter(nk => nk.organizationId === org.id);
      const articles = state.newsArticles.filter(na => na.organizationId === org.id);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">📰 기관별 뉴스 모니터링</h2>
              <p class="text-[10px] text-slate-500">우리 회사 및 만나는 상대 회사의 최근 기사를 검색합니다</p>
            </div>
            <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 text-[10px] font-bold">샌드박스 + 네이버 원문 연결</span>
          </div>

          <!-- 기관 선택 탭 -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${state.organizations.map(o => `
              <button onclick="state.selectedOrgIdForNews='${o.id}'; renderAll();" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 border ${
                o.id === org.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-200'
              }">
                ${o.canonicalName}
              </button>
            `).join('')}
          </div>

          <!-- 검색 키워드 추가/삭제 카드 -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5 text-xs">
            <div class="font-bold text-slate-800">${org.canonicalName} 뉴스 검색 키워드 관리</div>
            <div class="flex flex-wrap gap-1.5">
              ${keywords.map(k => `
                <span class="px-2.5 py-1 rounded-full bg-brand-50 text-brand-800 border border-brand-200 font-semibold flex items-center gap-1.5">
                  <span>#${k.keyword}</span>
                  <button onclick="removeNewsKeyword('${k.id}')" class="text-brand-400 hover:text-rose-600 font-bold">✕</button>
                </span>
              `).join('')}
            </div>
            <div class="flex gap-1.5 pt-1">
              <input id="input-new-keyword" type="text" placeholder="추가할 키워드 입력 (예: ${org.canonicalName} 인사)" class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs" />
              <button onclick="addNewsKeyword('${org.id}')" class="px-3 py-2 rounded-xl bg-brand-600 text-white font-bold shrink-0">+ 추가</button>
            </div>
          </div>

          <!-- 기사 목록 -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800">최신 기사 목록 (${articles.length}건)</span>
              <a href="https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(org.canonicalName)}" target="_blank" rel="noopener noreferrer" class="text-brand-600 font-semibold">
                네이버 뉴스 실시간 검색 ↗
              </a>
            </div>
            ${articles.map(art => `
              <a href="${art.originalUrl}" target="_blank" rel="noopener noreferrer" class="block p-3.5 rounded-xl border border-slate-200 hover:border-brand-500 transition space-y-1">
                <div class="flex items-center justify-between text-[10px] text-slate-500">
                  <span class="font-bold text-brand-700">#${art.matchedKeyword} · ${art.pressName}</span>
                  <span>${art.publishedAt}</span>
                </div>
                <div class="font-bold text-sm text-slate-900">${art.title} ↗</div>
                <p class="text-[11px] text-slate-600 leading-relaxed">${art.summarySnippet}</p>
              </a>
            `).join('')}
          </div>
        </div>
      `;
    }

    function addNewsKeyword(orgId) {
      const input = document.getElementById('input-new-keyword');
      if (!input || !input.value.trim()) return;
      const kw = input.value.trim();
      state.newsKeywords.push({
        id: `nk_${Date.now()}`,
        organizationId: orgId,
        keyword: kw,
        isPrimary: false
      });
      state.newsArticles.unshift({
        id: `news_${Date.now()}`,
        organizationId: orgId,
        matchedKeyword: kw,
        title: `[실시간 키워드 검색 연결] '${kw}' 관련 최신 뉴스 검색 결과 바로가기`,
        pressName: '네이버 뉴스 검색 연결',
        publishedAt: '방금 전',
        originalUrl: `https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(kw)}`,
        summarySnippet: `'${kw}' 키워드로 검색된 언론사 원문 목록으로 이동합니다.`
      });
      showToast(`✅ [${kw}] 뉴스 검색 키워드가 추가되었습니다.`, 'success');
      renderAll();
    }

    function removeNewsKeyword(keywordId) {
      const idx = state.newsKeywords.findIndex(k => k.id === keywordId);
      if (idx !== -1) {
        state.newsKeywords.splice(idx, 1);
        renderAll();
      }
    }

    // -----------------------------------------------------------------------
    // [화면 8] 마이 & 개인정보 설정 & 운영자 3대 역할 데이터 가시성 감사 뷰
    // -----------------------------------------------------------------------
    function renderMyAndSecurityScreen() {
      const user = getCurrentUser();
      const userPref = state.notificationPreferences[user.id] || { morningBriefingEnabled: true, morningBriefingTime: '08:00' };

      return `
        <div class="space-y-4">
          <!-- 1. 운영자 3대 역할(서버 운영자 / DB 관리자 / 배포 관리자) 데이터 접근 경계 인스펙터 -->
          <div class="bg-slate-900 text-slate-100 rounded-2xl p-4 border-2 border-rose-500/60 shadow-lg space-y-3 text-xs">
            <div class="flex items-center justify-between">
              <span class="px-2 py-0.5 rounded bg-rose-600 text-white font-extrabold text-[10px]">보안 감사 인스펙터</span>
              <span class="text-[10px] text-rose-300 font-mono">Operator Visibility & Threat Boundary</span>
            </div>
            <h3 class="text-sm font-extrabold text-white">TEAMYAK 운영자 역할별 볼 수 있는 데이터 vs 볼 수 없는 데이터</h3>
            <p class="text-[11px] text-slate-300 leading-relaxed">
              서버 운영자, 데이터베이스 관리자, 애플리케이션 배포 관리자 각각의 실제 접근 범위와 클라이언트 암호화(CSE)의 기술적 한계를 투명하게 검증합니다.
            </p>

            <!-- 3대 운영자 역할 탭 -->
            <div class="grid grid-cols-3 gap-1 bg-slate-800 p-1 rounded-xl text-[11px] font-bold">
              <button onclick="state.adminRoleSubTab='DB_ADMIN'; renderAll();" class="py-1.5 rounded-lg ${state.adminRoleSubTab === 'DB_ADMIN' ? 'bg-rose-600 text-white' : 'text-slate-400'}">
                ① DB 관리자
              </button>
              <button onclick="state.adminRoleSubTab='SERVER_OP'; renderAll();" class="py-1.5 rounded-lg ${state.adminRoleSubTab === 'SERVER_OP' ? 'bg-rose-600 text-white' : 'text-slate-400'}">
                ② 서버 운영자
              </button>
              <button onclick="state.adminRoleSubTab='DEPLOY_ADMIN'; renderAll();" class="py-1.5 rounded-lg ${state.adminRoleSubTab === 'DEPLOY_ADMIN' ? 'bg-rose-600 text-white' : 'text-slate-400'}">
                ③ 배포 관리자
              </button>
            </div>

            ${renderOperatorRoleInspectorContent()}
          </div>

          <!-- 2. 당일 오전 8시 알림 설정 & iOS vs Android 동작 조건 검증 -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3 text-xs">
            <div class="font-extrabold text-sm text-slate-900">⏰ 당일 아침 알림 설정 및 OS별 동작 검증</div>
            <div class="flex items-center justify-between py-2 border-b border-slate-100">
              <div>
                <div class="font-bold text-slate-800">모임 당일 아침 브리핑 알림 시각</div>
                <div class="text-[10px] text-slate-500">기본값 오전 08:00 · 사용자가 변경 가능</div>
              </div>
              <input
                type="time"
                value="${userPref.morningBriefingTime}"
                onchange="updateMorningAlarmTime(this.value)"
                class="px-2.5 py-1.5 rounded-lg border border-slate-300 font-bold text-slate-900"
              />
            </div>

            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-2 text-[11px]">
              <div class="font-bold text-slate-800">📱 iOS vs Android 당일 오전 8시 알림 실제 동작 조건</div>
              <div>• <strong>외부 캘린더 알람 (Google / .ics VALARM)</strong>: iOS와 Android 모두 <strong>100% 보장</strong>됩니다 (MVP 1순위 알림 수단).</div>
              <div>• <strong>Android (Chrome / 삼성 인터넷)</strong>: 브라우저 웹 푸시 권한 동의 시 백그라운드 푸시 수신이 가능합니다.</div>
              <div class="text-rose-700 font-medium">• <strong>iOS (iPhone Safari / 카톡 인앱 브라우저 제약)</strong>: 일반 웹페이지나 카톡 인앱 방문만으로는 Web Push가 동작하지 않으며, 반드시 Safari에서 <strong>[공유 → 홈 화면에 추가]</strong>로 설치한 뒤 실행해야 웹 푸시가 보장됩니다.</div>
            </div>
          </div>

          <!-- 3. 프로필 · 무팀 모드 · 이직/팀 탈퇴 시 데이터 분리 설정 -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3 text-xs">
            <div class="font-extrabold text-sm text-slate-900">👤 내 프로필 및 데이터 소유권 설정</div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100">
              <span class="text-slate-500">현재 계정</span>
              <span class="font-bold text-slate-900">${user.displayName} (${user.jobTitle})</span>
            </div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100">
              <div>
                <div class="font-bold text-slate-800">팀 미가입(무팀 개인 자격) 모드 시뮬레이션</div>
                <div class="text-[10px] text-slate-500">팀에 가입하지 않아도 모임 참석·캘린더·개인 이력 100% 사용 가능</div>
              </div>
              <button onclick="toggleNoTeamMode()" class="px-3 py-1 rounded-lg font-bold text-[11px] ${user.noTeamMode ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}">
                ${user.noTeamMode ? '무팀 모드 ON' : '팀 소속 모드'}
              </button>
            </div>
            <p class="text-[11px] text-slate-500 leading-relaxed">
              • 이직이나 부서 이동으로 기존 팀에서 탈퇴(<code>status = 'LEFT'</code>)하더라도, 내 개인 미팅 이력(<code>personal_meeting_histories</code>)은 내 계정에 그대로 보존되며 이전 팀의 공유 일정 접근권만 분리 회수됩니다.
            </p>
          </div>
        </div>
      `;
    }

    function renderOperatorRoleInspectorContent() {
      const sampleHistory = state.personalMeetingHistories[0];
      if (state.adminRoleSubTab === 'DB_ADMIN') {
        return `
          <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 space-y-2 text-[11px]">
            <div class="font-bold text-amber-300">① 데이터베이스 관리자 (postgres 슈퍼유저 · 스냅샷 · 백업 접근자)</div>
            <div>• <strong>기술적 사실</strong>: PostgreSQL 슈퍼유저와 <code>service_role</code> 키는 <code>BYPASSRLS</code> 권한을 가지므로 RLS 정책만으로 DB 관리자의 테이블 조회를 막을 수 없습니다.</div>
            <div>• <strong>볼 수 있는 데이터</strong>: 진행 중인 모임의 일시·상태 메타데이터(<code>meetings</code>) 및 활성 참석자 UUID 연결(<code>meeting_participants</code>).</div>
            <div>• <strong>볼 수 없는 데이터 (AES-256-GCM 암호화)</strong>: <code>personal_meeting_histories</code> 테이블의 개인 메모 및 암호화된 과거 만남 맥락.</div>
            <div class="bg-slate-950 p-2.5 rounded-lg font-mono text-[10px] text-emerald-400 space-y-1 overflow-x-auto">
              <div class="text-slate-400">-- DB 관리자가 SELECT * FROM personal_meeting_histories 실행 시 실제 보이는 값:</div>
              <div>owner_user_id: "${sampleHistory?.ownerUserId}"</div>
              <div>encrypted_history_blob: "${sampleHistory?.encryptedHistoryBlob}"</div>
              <div>memo_iv: "${sampleHistory?.memoIv}"</div>
              <div class="text-rose-400">→ 평문 메모 및 상세 맥락 복호화 불가 (키 미보유)</div>
            </div>
          </div>
        `;
      }
      if (state.adminRoleSubTab === 'SERVER_OP') {
        return `
          <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 space-y-2 text-[11px]">
            <div class="font-bold text-amber-300">② 서버 운영자 (API 게이트웨이 · 런타임 로그 · 알림 스케줄러)</div>
            <div>• <strong>볼 수 있는 데이터</strong>: HTTP 요청 시각·IP, 모임 확정 일시, 알림 발송 대상 UUID, 네이버 뉴스 API 프록시 호출 시점의 검색 키워드.</div>
            <div>• <strong>볼 수 없는 데이터</strong>: 초대 링크의 URL Fragment(<code>#k=7f9a2b...</code>)는 RFC 3986 브라우저 표준상 서버로 전송되지 않으며, 브라우저에서 암호화된 개인 메모 평문도 서버로 전송되지 않습니다.</div>
          </div>
        `;
      }
      return `
        <div class="bg-slate-800 rounded-xl p-3 border border-rose-500/50 space-y-2 text-[11px]">
          <div class="font-bold text-rose-300">③ 애플리케이션 배포 관리자 (프런트엔드 빌드 · CDN 배포 권한자)</div>
          <div>• <strong>악의적 프런트엔드 코드 배포 위험 평가 (핵심 보안 고지)</strong>:</div>
          <p class="text-slate-300 leading-relaxed">
            웹 애플리케이션에서 클라이언트 암호화(Web Crypto API)를 적용하더라도, 배포 관리자가 악의적으로 변조된 JavaScript 번들을 배포하면 브라우저 메모리에서 패스프레이즈 입력이나 <code>window.location.hash</code>(<code>#k=</code> 키), 복호화된 DOM 텍스트를 가로채 외부로 전송할 수 있습니다.
          </p>
          <div class="text-amber-300 font-semibold">
            → 따라서 팀약은 이를 "완전한 영지식 암호화"라고 과장하지 않으며, 엄격한 CSP(<code>connect-src</code> 제한), Subresource Integrity(SRI) 해시 검증, 소스코드 커밋 해시 공개를 통해 프런트엔드 변조 위험을 통제합니다.
          </div>
        </div>
      `;
    }

    function updateMorningAlarmTime(newTime) {
      const user = getCurrentUser();
      if (!state.notificationPreferences[user.id]) {
        state.notificationPreferences[user.id] = { morningBriefingEnabled: true, morningBriefingTime: newTime };
      } else {
        state.notificationPreferences[user.id].morningBriefingTime = newTime;
      }
      showToast(`⏰ 모임 당일 아침 브리핑 알림 시간이 오전/오후 [${newTime}]으로 변경되었습니다. 이후 다운로드하는 .ics 파일의 VALARM에도 즉시 반영됩니다.`, 'success');
      renderAll();
    }

    function toggleNoTeamMode() {
      const user = getCurrentUser();
      user.noTeamMode = !user.noTeamMode;
      showToast(user.noTeamMode
        ? '👤 [무팀(개인 자격) 모드]가 켜졌습니다. 소속 팀이 없어도 모임 참석, 캘린더 자동 등록, 개인 이력 관리를 모두 이용할 수 있습니다.'
        : '🏢 [팀 소속 모드]로 전환되었습니다.', 'info');
      renderAll();
    }

    // -----------------------------------------------------------------------
    // 9. 플로팅 버튼(FAB) 및 하단 5탭 내비게이션 렌더링
    // -----------------------------------------------------------------------
    function renderFab() {
      const el = document.getElementById('fab-container');
      if (!el) return;
      if (['home', 'calendar', 'meetings'].includes(state.currentTab)) {
        el.innerHTML = `
          <button onclick="state.currentTab='create_meeting'; renderAll();" class="pointer-events-auto px-4 py-2.5 rounded-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs shadow-lg flex items-center gap-1.5 border border-white/20">
            <span class="text-sm leading-none">+</span>
            <span>새 모임 만들기</span>
          </button>
        `;
      } else {
        el.innerHTML = '';
      }
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottom-nav');
      if (!nav) return;
      const items = [
        { id: 'home', label: '홈', icon: '🏠' },
        { id: 'calendar', label: '캘린더', icon: '📅' },
        { id: 'meetings', label: '모임', icon: '🤝' },
        { id: 'history', label: '이력', icon: '🔐' },
        { id: 'my', label: '마이·보안', icon: '🛡️' }
      ];
      nav.innerHTML = items.map(item => {
        const active = state.currentTab === item.id ||
          (item.id === 'meetings' && ['meeting_detail', 'create_meeting', 'invite_landing'].includes(state.currentTab)) ||
          (item.id === 'home' && state.currentTab === 'news');
        return `
          <button onclick="state.currentTab='${item.id}'; renderAll();" class="py-2 flex flex-col items-center justify-center gap-0.5 transition ${
            active ? 'text-brand-600 font-extrabold' : 'text-slate-400 font-medium hover:text-slate-700'
          }">
            <span class="text-base leading-none">${item.icon}</span>
            <span>${item.label}</span>
          </button>
        `;
      }).join('');
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      initRealCryptoForSamples();
    });
  </script>
</body>
</html>
